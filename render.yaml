services:
  - type: web
    name: hhgoa-sentinel-console
    runtime: python
    plan: free
    region: oregon
    # Single-URL deploy: serves both FastAPI backend and clean-room analyst console (frontend/) directly at /
    # Builds the prepared SQLite graph store from the committed synthetic
    # CSVs at deploy time. No data is fetched from an external release;
    # the round's real dataset is never redistributed.
    buildCommand: "pip install -r requirements.txt && TRANSACTIONS_CSV=data/synthetic/transactions.csv IDENTITY_CSV=data/synthetic/identity.csv CLOSED_CASES_CSV=data/synthetic/closed_cases_history.csv CASE_PACK_CSV=data/synthetic/case_pack.csv python -m backend.scripts.prepare_data"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pins Python 3.12 for the Render runtime
      - key: PYTHON_VERSION
        value: "3.12"
      # Hosted demo defaults: demo mode on, local synthetic graph, no
      # external LLM calls unless a separate NEBIUS_API_KEY is supplied.
      - key: APP_ENV
        value: development
      - key: DEMO_MODE
        value: "1"
      - key: GRAPH_BACKEND
        value: local
      # The only LLM vendor in this submission is Nebius Token Factory with
      # NVIDIA Nemotron.
      # To enable live Nemotron calls in the hosted demo, add a host secret
      # named NEBIUS_API_KEY in the Render dashboard.
      - key: NEBIUS_API_KEY
        sync: false
      - key: LLM_DAILY_CALL_CAP
        value: "40"
      - key: LLM_CALLS_PER_IP_PER_HOUR
        value: "10"
      - key: NEBIUS_BASE_URL
        value: "https://api.tokenfactory.nebius.com/v1"
      - key: NEBIUS_MODEL_NANO
        value: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
      - key: NEBIUS_MODEL_ULTRA
        value: "nvidia/Nemotron-3-Ultra-550b-a55b"
      # To run against the live TigerGraph instance instead, set
      # GRAPH_BACKEND=tigergraph and fill in the variables below:
      - key: TG_HOST
        sync: false
      - key: TG_GRAPH
        value: fraud_investigation
      - key: TG_SECRET
        sync: false
      - key: EVIDENCE_REQUEST_MODE
        value: simulated
