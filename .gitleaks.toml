# Gitleaks configuration for the Sentinel Graph repository.
# Keeps the default rule set and allowlists one known false positive: the
# token-accounting field name "completion_tokens_total" in the eval script.

[extend]
useDefault = true

# Allowlist: metric field names that look like API keys to the generic rule.
[[allowlists]]
description = "Token accounting field names, not credentials"
regexTarget = "match"
regexes = ['''completion_tokens_total''']
# Allowlist: local, uncommitted runtime trees that a whole-directory scan walks.
# `gitleaks git` (history) remains the gate; these paths never enter it.
[[allowlists]]
description = "Local runtime files: virtualenv, Next build cache, developer .env"
paths = [
  '''\.venv/''',
  '''sentinel-ui/\.next/''',
  '''^\.env$''',
]