# HHGOA demo — single-URL deployment.
#
#   docker compose up --build
#   open http://localhost:8008        (API + console on the same port)
#
# One container, one port. The FastAPI backend and the Next.js console are
# co-hosted inside it; the FastAPI app proxies every non-API path to the
# Node UI server, so everything is reachable from a single URL.
#
# Demo mode (default): DEMO_MODE=1 — Nemotron answers replay from the
# committed answer files and Token Factory costs zero. Live mode:
# uncomment NEBIUS_API_KEY and set DEMO_MODE=0.

services:
  app:
    build: .
    container_name: hhgoa-demo
    ports:
      - "8008:8000"
    environment:
      DEMO_MODE: "1"
      GRAPH_BACKEND: "local"
      # Optional live Nemotron runs (leave unset for the free demo):
      # NEBIUS_API_KEY: "your-nebius-api-key"
      # DEMO_MODE: "0"
    volumes:
      # Persist the LLM answer cache and call log across restarts so the
      # demo-mode replays keep working after the container is rebuilt.
      - ./data/logs:/app/data/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
