name: CI

on:
  push:
    branches: [main, path-b]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tooling
        run: pip install ruff

      - name: Backend defect gate
        run: python -m ruff check backend scripts tests

      - name: Build local database from synthetic data
        run: python -m backend.scripts.prepare_data

      - name: Run pytest
        run: python -m pytest -q --no-header

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build the single-container demo image
        run: docker compose build

      - name: Start the container
        run: docker compose up -d

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8008/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "container did not become healthy in 300s"
          docker compose logs --tail=200
          exit 1

      - name: Container smoke — health, clean-room console, case replay, image hygiene
        run: |
          set -eu
          # 1. Health contract.
          curl -fsS http://localhost:8008/health | grep -q '"status": *"healthy"'
          # 2. Clean-room console served at root from single FastAPI URL.
          curl -fsS http://localhost:8008/ | grep -q "FraudLens"
          # 3. One case loads end to end from the committed answer pack.
          curl -fsS http://localhost:8008/api/investigations/CASE-001 > /tmp/case.json
          grep -q 'CASE-001' /tmp/case.json
          grep -q '"verdict"' /tmp/case.json
          # 4. Image hygiene.
          if docker exec hhgoa-demo sh -c 'find / -xdev \( -name ".env" -o -name ".env.*" \) -not -name ".env.example" 2>/dev/null | grep -q .'; then
            echo "FAIL: .env file found inside the image"
            exit 1
          fi
          if docker exec hhgoa-demo sh -c 'test -f /app/data/prepared/investigation.db'; then
            echo "note: prepared DB exists (built at boot by the entrypoint)"
          fi
          echo "container smoke passed"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
