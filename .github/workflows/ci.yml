name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tooling
        run: pip install ruff

      - name: Backend defect gate
        run: python -m ruff check backend scripts tests

      - name: Build local database from synthetic data
        run: python -m backend.scripts.prepare_data

      - name: Run pytest
        run: python -m pytest -q --no-header

  sentinel-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sentinel-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentinel-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  sentinel-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sentinel-ui
    defaults:
      run:
        working-directory: sentinel-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentinel-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build static demo snapshot
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_DATA: "1"

      - name: Start the standalone production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/sentinel-ui.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sentinel-ui.log
          exit 1

      - name: Run canonical UI browser smoke test
        working-directory: sentinel-ui/e2e
        run: BASE=http://127.0.0.1:3000 SNAPSHOT=1 node smoke.mjs

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build the single-container demo image
        run: docker compose build

      - name: Start the container
        run: docker compose up -d

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8008/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "container did not become healthy in 300s"
          docker compose logs --tail=200
          exit 1

      - name: Container smoke — health, one case, image hygiene
        run: |
          set -eu
          # 1. Health contract.
          curl -fsS http://localhost:8008/health | grep -q '"status": *"healthy"'
          # 2. One case loads end to end from the committed answer pack.
          # /api/cases/{id} is the Q&A POST route; the answer file lives at /api/investigations/{id}.
          curl -fsS http://localhost:8008/api/investigations/CASE-001 > /tmp/case.json
          grep -q 'CASE-001' /tmp/case.json
          grep -q '"verdict"' /tmp/case.json
          # 3. The image must not contain environment files. The synthetic CSVs
          #    are intentionally baked in (prepare_data reads them at startup);
          #    the prepared SQLite store must NOT be, it is built at boot.
          if docker exec hhgoa-demo sh -c 'find / -xdev \( -name ".env" -o -name ".env.*" \) -not -name ".env.example" 2>/dev/null | grep -q .'; then
            echo "FAIL: .env file found inside the image"
            exit 1
          fi
          if docker exec hhgoa-demo sh -c 'test -f /app/data/prepared/investigation.db'; then
            echo "note: prepared DB exists (built at boot by the entrypoint)"
          fi
          echo "container smoke passed"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
